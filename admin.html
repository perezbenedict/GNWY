<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Response Vault — Grace Nation Wealthy Youths</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="page-glow" aria-hidden="true"></div>

  <!-- Shared gradient defs: kept in a zero-size box (display:none can break gradient references) -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="vault-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#F5DFA6" />
        <stop offset="55%" stop-color="#E8C77A" />
        <stop offset="100%" stop-color="#B8862F" />
      </linearGradient>
      <radialGradient id="vault-globe" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#1E3A6B" />
        <stop offset="100%" stop-color="#0C1A38" />
      </radialGradient>
      <linearGradient id="vault-flame" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#D8324C" />
        <stop offset="100%" stop-color="#B3223A" />
      </linearGradient>
      <clipPath id="vault-globe-clip">
        <circle cx="60" cy="60" r="35" />
      </clipPath>
    </defs>
  </svg>

  <template id="emblem-tpl">
    <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <circle cx="60" cy="60" r="56" fill="none" stroke="url(#vault-gold)" stroke-width="1.6" />
      <circle cx="60" cy="60" r="50.5" fill="none" stroke="url(#vault-gold)" stroke-width="0.8" opacity="0.65" />
      <circle cx="60" cy="60" r="35" fill="url(#vault-globe)" />
      <g clip-path="url(#vault-globe-clip)" fill="none" stroke="#C9D1DE" stroke-width="0.9" opacity="0.65">
        <circle cx="60" cy="60" r="35" />
        <ellipse cx="60" cy="60" rx="12" ry="35" />
        <ellipse cx="60" cy="60" rx="24" ry="35" />
        <line x1="25" y1="60" x2="95" y2="60" />
        <path d="M31 42 H89" />
        <path d="M31 78 H89" />
      </g>
      <path d="M60 26 C 69 43, 78 52, 75 67 C 72.5 79, 65 87, 60 90 C 55 87, 47.5 79, 45 67 C 42 52, 51 43, 60 26 Z" fill="url(#vault-flame)" />
      <path d="M60 49 C 64.5 59, 69 63.5, 67 71 C 65.4 77, 62 80, 60 81 C 58 80, 54.6 77, 53 71 C 51 63.5, 55.5 59, 60 49 Z" fill="url(#vault-gold)" opacity="0.95" />
    </svg>
  </template>

  <!-- Gate -->
  <main class="gate" id="gate">
    <section class="gate-card" aria-labelledby="gate-title">
      <span class="gate-emblem" data-emblem aria-hidden="true"></span>
      <p class="overline">Grace Nation Wealthy Youths</p>
      <h1 class="gate-title" id="gate-title">Response Vault</h1>
      <p class="gate-sub">Enter your leadership access key</p>

      <form id="gate-form" novalidate>
        <label class="field-label" for="access-key">Access key</label>
        <input class="input" type="password" id="access-key" name="access-key" autocomplete="current-password" spellcheck="false" />
        <p class="alert" id="gate-error" role="alert" hidden>Access key not recognized.</p>
        <button class="btn btn--gold btn--block" type="submit">Unlock</button>
      </form>
    </section>
  </main>

  <!-- Dashboard -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-emblem" data-emblem aria-hidden="true"></span>
          <h1 class="brand-name">Grace Nation Wealthy Youths <span class="brand-sep">—</span> Response Vault</h1>
        </div>
        <button class="btn btn--ghost" id="lock-btn" type="button">Lock</button>
      </div>
    </header>

    <main class="shell">
      <section class="stats" aria-label="Response summary">
        <article class="stat">
          <p class="stat-label">Total responses</p>
          <p class="stat-value" id="stat-total">—</p>
        </article>
        <article class="stat">
          <p class="stat-label">Average rating</p>
          <div class="stat-rating">
            <span class="stat-stars" id="stat-stars" aria-hidden="true"></span>
            <span class="stat-value stat-value--rating" id="stat-average">—</span>
          </div>
        </article>
        <article class="stat">
          <p class="stat-label">Responses today</p>
          <p class="stat-value" id="stat-today">—</p>
        </article>
        <article class="stat">
          <p class="stat-label">Top category</p>
          <p class="stat-value stat-value--name" id="stat-top">—</p>
          <p class="stat-note" id="stat-top-note" hidden></p>
        </article>
      </section>

      <section class="filters" aria-label="Filter responses">
        <div class="filter">
          <label class="field-label" for="filter-q">Search</label>
          <input class="input" type="search" id="filter-q" placeholder="Text, name or contact" autocomplete="off" />
        </div>
        <div class="filter">
          <label class="field-label" for="filter-rating">Minimum rating</label>
          <select class="input" id="filter-rating">
            <option value="">Any rating</option>
            <option value="4">4+ stars</option>
            <option value="3">3+ stars</option>
            <option value="2">2+ stars</option>
            <option value="1">1+ star</option>
          </select>
        </div>
        <div class="filter">
          <label class="field-label" for="filter-category">Category</label>
          <select class="input" id="filter-category">
            <option value="">Any category</option>
            <option value="Worship">Worship</option>
            <option value="The Word">The Word</option>
            <option value="Production &amp; Sound">Production &amp; Sound</option>
            <option value="Welcome &amp; Hospitality">Welcome &amp; Hospitality</option>
            <option value="Youth Activities">Youth Activities</option>
            <option value="Logistics &amp; Venue">Logistics &amp; Venue</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="filter filter--action">
          <span class="field-label field-label--spacer" aria-hidden="true">&nbsp;</span>
          <button class="btn btn--ghost" id="clear-btn" type="button">Clear</button>
        </div>
      </section>

      <div class="actions">
        <button class="btn btn--gold" id="export-btn" type="button">Export CSV</button>
        <button class="btn btn--ghost" id="refresh-btn" type="button">Refresh</button>
      </div>

      <div class="alert alert--row" id="list-error" role="alert" hidden>
        <span id="list-error-text"></span>
        <button class="btn btn--tiny" id="retry-btn" type="button">Retry</button>
      </div>

      <div class="skeletons" id="skeletons" hidden aria-hidden="true">
        <div class="skel-card">
          <span class="skel skel--meta"></span>
          <span class="skel skel--chips"></span>
          <span class="skel skel--block"></span>
          <span class="skel skel--block"></span>
          <span class="skel skel--block skel--short"></span>
        </div>
        <div class="skel-card">
          <span class="skel skel--meta"></span>
          <span class="skel skel--chips"></span>
          <span class="skel skel--block"></span>
          <span class="skel skel--block"></span>
          <span class="skel skel--block skel--short"></span>
        </div>
        <div class="skel-card">
          <span class="skel skel--meta"></span>
          <span class="skel skel--chips"></span>
          <span class="skel skel--block"></span>
          <span class="skel skel--block"></span>
          <span class="skel skel--block skel--short"></span>
        </div>
      </div>

      <div class="list" id="list" aria-live="polite" hidden></div>

      <div class="empty" id="empty" hidden>
        <span class="empty-emblem" data-emblem aria-hidden="true"></span>
        <p class="empty-text">No responses yet - share the QR poster after service to begin.</p>
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
