<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan to Share Your Voice — Grace Nation Wealthy Youths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E13;
    --gold-1: #F5DFA6;
    --gold-2: #E8C77A;
    --gold-3: #B8862F;
    --crimson: #B3223A;
    --ink-soft: #C9CDD6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #15181F;
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px;
  }

  .poster {
    width: 210mm;
    min-height: 297mm;
    background: var(--bg);
    background-image:
      radial-gradient(120% 70% at 50% -10%, rgba(232, 199, 122, 0.14), transparent 60%),
      radial-gradient(90% 50% at 50% 110%, rgba(179, 34, 58, 0.12), transparent 65%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 22mm 18mm;
    gap: 10mm;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }

  .emblem-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6mm;
  }

  .emblem { width: 30mm; height: 30mm; display: block; }

  .org-name {
    font-family: 'Inter', sans-serif;
    font-size: 12.5pt;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
  }

  .divider {
    width: 46mm;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
    border: 0;
    margin: 0;
  }

  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 40pt;
    line-height: 1.1;
    margin: 0;
    color: var(--gold-1);
  }

  .subline {
    font-family: 'Inter', sans-serif;
    font-size: 11.5pt;
    font-weight: 400;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 140mm;
    margin: 0;
  }

  .qr-card {
    background: #fff;
    border: 1.5px solid var(--gold-2);
    border-radius: 6mm;
    padding: 9mm;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  #qr {
    width: 60mm;
    height: 60mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #qr svg, #qr img { width: 100%; height: 100%; display: block; }

  .qr-fallback {
    width: 60mm;
    color: #1A1D24;
    font-family: 'Inter', sans-serif;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 4mm;
  }

  .qr-fallback .label {
    font-size: 9.5pt;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--crimson);
  }

  .qr-fallback .url {
    font-size: 9pt;
    line-height: 1.5;
    word-break: break-all;
    color: #1A1D24;
    background: #F2F3F6;
    border: 1px solid #D8DBE2;
    border-radius: 3mm;
    padding: 3mm;
  }

  .caption {
    font-family: 'Inter', sans-serif;
    font-size: 13pt;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--gold-1), var(--gold-2) 60%, var(--gold-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
  }

  .footer-note {
    font-family: 'Inter', sans-serif;
    font-size: 8.5pt;
    color: #7C828E;
    letter-spacing: 0.08em;
    margin: 0;
  }

  @page { size: A4 portrait; margin: 0; }

  @media print {
    html, body {
      background: #fff;
      padding: 0;
      margin: 0;
      min-height: auto;
      display: block;
    }
    .poster {
      width: 210mm;
      height: 297mm;
      min-height: 297mm;
      margin: 0;
      box-shadow: none;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .org-name, .caption, .headline, .divider {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
  <main class="poster">
    <div class="emblem-block">
      <svg class="emblem" viewBox="0 0 120 120" role="img" aria-label="Grace Nation Wealthy Youths emblem">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F5DFA6"/>
            <stop offset="0.55" stop-color="#E8C77A"/>
            <stop offset="1" stop-color="#B8862F"/>
          </linearGradient>
          <radialGradient id="globeGrad" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0" stop-color="#1E3A5F"/>
            <stop offset="1" stop-color="#0E1B2E"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="1.6"/>
        <circle cx="60" cy="60" r="51" fill="none" stroke="url(#goldGrad)" stroke-width="0.7"/>
        <circle cx="60" cy="66" r="30" fill="url(#globeGrad)"/>
        <g fill="none" stroke="#C9CDD6" stroke-width="1" opacity="0.9">
          <ellipse cx="60" cy="66" rx="12" ry="30"/>
          <ellipse cx="60" cy="66" rx="24" ry="30"/>
          <path d="M32 56 H88"/>
          <path d="M30 66 H90"/>
          <path d="M32 76 H88"/>
        </g>
        <path d="M60 14 C68 26 76 31 76 42 C76 51 69 57 60 57 C51 57 44 51 44 42 C44 34 50 30 52 24 C54 30 58 32 58 36 C60 32 60 22 60 14 Z"
              fill="#B3223A"/>
        <path d="M60 28 C63 34 67 37 67 43 C67 48 64 51 60 51 C56 51 53 48 53 43 C53 39 56 36 57 33 C58 36 60 37 60 40 C61 36 60 32 60 28 Z"
              fill="#F5DFA6" opacity="0.85"/>
      </svg>
      <p class="org-name">Grace Nation Wealthy Youths</p>
      <hr class="divider">
    </div>

    <h1 class="headline">We'd love to hear from you</h1>
    <p class="subline">Scan the code to share your suggestions, expectations and feedback from today's service — it takes under a minute.</p>

    <div class="qr-card" id="qr-card">
      <div id="qr" aria-label="QR code linking to the feedback page"></div>
    </div>

    <p class="caption">Scan to share your voice</p>
    <p class="footer-note">Your voice shapes what comes next.</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode-generator.min.js"></script>
  <script>
    // paste the deployed feedback page URL here
    const SITE_URL = '';

    function fallbackUrl() {
      if (SITE_URL) return SITE_URL;
      // opened from the same folder as index.html: strip the filename
      var u = window.location.href;
      if (u.indexOf('file:') === 0) return u.replace(/[^/]*$/, 'index.html');
      return u.replace(/[^/]*$/, '') || u;
    }

    function showOfflineBlock(url) {
      var card = document.getElementById('qr-card');
      card.innerHTML =
        '<div class="qr-fallback">' +
        '<span class="label">QR unavailable offline</span>' +
        '<span class="url">Open this page manually:</span>' +
        '<span class="url">' + url.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>' +
        '</div>';
    }

    function renderQr() {
      var url = fallbackUrl();
      if (typeof qrcode !== 'function') {
        showOfflineBlock(url);
        return;
      }
      try {
        var qr = qrcode(0, 'M'); // auto type number, error correction M
        qr.addData(url);
        qr.make();
        document.getElementById('qr').innerHTML = qr.createSvgTag({
          cellSize: 4,
          margin: 0,
          scalable: true
        });
      } catch (e) {
        showOfflineBlock(url);
      }
    }

    window.addEventListener('load', renderQr);
    // if the CDN script never loaded, `qrcode` is undefined and renderQr shows the offline block
    if (document.readyState === 'complete') renderQr();
  </script>
</body>
</html>
